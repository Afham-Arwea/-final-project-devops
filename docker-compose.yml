services:
  # 1. ระบบหลังบ้านสำหรับรันโมเดล AI (LLM Inference Engine)
  ollama:
    image: ollama/ollama:latest
    container_name: openclaw-ollama-1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_network
    restart: unless-stopped

  # 2. ระบบหน้าบ้านควบคุมและ Dashboard UI (ใช้ Open WebUI แทน)
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openclaw-openclaw-gateway-1
    ports:
      - "18789:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - ai_network
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui:

networks:
  ai_network:
    driver: bridge
